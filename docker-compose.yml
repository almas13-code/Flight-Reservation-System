version: '3.8'

services:
  web:
    build: .
    container_name: flight_reservation_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: root
      DB_NAME: flight_reservation_system
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: flight_reservation_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: flight_reservation_system
    ports:
      - "3307:3306"
    volumes:
      - ./flight_reservation_system.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql

volumes:
  db_data:
