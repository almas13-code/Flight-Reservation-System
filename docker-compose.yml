version: '3.8'

services:
  web:
    build: .
    container_name: skyreserve_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: root
      DB_NAME: skyreserve
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: skyreserve_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: skyreserve
    ports:
      - "3307:3306"
    volumes:
      - ./skyreserve.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql

volumes:
  db_data:
